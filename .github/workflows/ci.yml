name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小權限:CI 只需讀 repo,不需要寫。收斂預設 token 的權限面。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
